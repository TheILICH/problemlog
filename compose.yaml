name: problem-log   # fixed name so the volume is always problem-log_pgdata

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # named volume, data lives outside the container
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      # $$ so compose leaves it alone, the shell inside the container fills it
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # no ports on purpose, only the backend can reach the db

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy   # wait until pg_isready passes
    environment:
      PORT: "8080"
      DB_HOST: db            # service name = hostname inside the compose network
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${APP_PORT:-8080}:8080"     # host:container
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  backend-net:

volumes:
  pgdata:
